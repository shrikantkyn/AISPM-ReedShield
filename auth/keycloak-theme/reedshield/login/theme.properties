# ReedShield — Keycloak login theme
# Child of the stock "keycloak" login theme. We inherit every template and all
# security-relevant form handling (CSRF tokens, message logic, WebAuthn, OTP)
# unchanged, and only layer branding CSS on top.
#
# `styles` fully replaces the parent list, so we re-list the parent's own
# css/login.css (resolved from the parent theme by Keycloak's fallback) and then
# append our reedshield.css so it wins the cascade. `stylesCommon` (PatternFly) is
# NOT overridden here, so it is inherited from the parent as-is.
parent=keycloak
import=common/keycloak

styles=css/login.css css/reedshield.css

# Clicking the brand logo returns to the ReedShield marketing home.
kcLogoLink=/home
