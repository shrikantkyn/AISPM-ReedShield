# Compress HTML, CSS, JS, JSON, SVG and proxied API payloads. Static
# assets are content-hashed by the build, so they are cached for a year;
# index.html is never cached so a new deploy is picked up immediately.
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_types        text/plain text/css application/json application/javascript
                  application/x-javascript text/javascript image/svg+xml
                  application/manifest+json text/event-stream;

server {
    listen 3001;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS resolver so nginx re-resolves upstream
    # hostnames on every request instead of caching them at startup.
    # This prevents 502s after upstream containers are rebuilt/restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers (audit finding M2). `always` so they apply to error
    # responses too. nginx clears inherited add_header in any location that
    # sets its own, so this set is repeated in the /assets and =/index.html
    # locations below. HSTS is intentionally omitted (local compose serves
    # HTTP); add Strict-Transport-Security at the TLS edge in shared deploys.
    # 'unsafe-inline' for styles is required by the app's inline style props;
    # script stays 'self' only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://keycloak.local:8180; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Service-to-service internal routes must never be reachable from the
    # browser edge (audit finding H3). This regex is evaluated before the
    # prefix /api/ proxy blocks below, so /api/internal/* and
    # /api/spm/internal/* return 404 instead of being forwarded.
    location ~ ^/api/(spm/|v1/)?internal/ {
        return 404;
    }

    # Proxy orchestrator calls (Runtime page — sessions, events, WebSocket)
    # NOTE: proxy_pass with a variable disables automatic URI prefix stripping,
    # so we use an explicit rewrite to preserve /api/v1/ prefix before forwarding.
    location /api/v1/ {
        set $orchestrator http://agent-orchestrator:8094;
        rewrite ^(.*)$ $1 break;
        proxy_pass         $orchestrator;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # SPM API (AI Security Posture Management) — model registry, compliance,
    # audit export. Must come BEFORE the generic /api/ catch-all.
    # Strip /api/spm/ before forwarding (matches vite dev proxy behaviour).
    location /api/spm/ {
        set $spm_api http://spm-api:8092;
        rewrite ^/api/spm/(.*)$ /$1 break;
        proxy_pass         $spm_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        # Big uploads (8 GB cap enforced by app). Raise client_max_body_size
        # and relax read timeout so large model files don't time out.
        client_max_body_size  8g;
        proxy_request_buffering off;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }

    # Proxy API calls to the CPM API service
    # NOTE: proxy_pass with a variable disables automatic URI prefix stripping,
    # so we use an explicit rewrite to strip /api/ before forwarding.
    location /api/ {
        set $api http://api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         $api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # SSE streaming — must disable buffering so tokens flow through immediately
    location /api/chat/stream {
        set $api_sse http://api:8080;
        proxy_pass              $api_sse/chat/stream;
        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        Connection '';
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      300s;
        chunked_transfer_encoding on;
        add_header              X-Accel-Buffering no;
    }

    # WebSocket proxy — /ws/* → api:8080/ws/*
    location /ws/ {
        set $api_ws http://api:8080;
        proxy_pass         $api_ws;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Keycloak — VITE_KEYCLOAK_URL is empty by design (see src/api.js), so the
    # SPA calls /realms/* on its own origin expecting an ingress-level proxy
    # to Keycloak (an Istio VirtualService in the K8s deploy). Local compose
    # has no such ingress, so proxy it here instead.
    location /realms/ {
        set $keycloak http://keycloak:8080;
        proxy_pass         $keycloak;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Do NOT layer the SPA's strict CSP onto Keycloak: its hosted login page
        # uses inline scripts and ships its own appropriate CSP. Setting a header
        # here resets the inherited server-level add_header set (audit M2), so
        # only Keycloak's own security headers apply to these responses.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Keycloak login page theme assets (CSS/JS/images).
    location /resources/ {
        set $keycloak http://keycloak:8080;
        proxy_pass         $keycloak;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback
    # Hashed build assets: immutable, cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        # Re-declare security headers: a location's own add_header clears the
        # inherited server-level set (audit M2).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://keycloak.local:8180; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
